<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<title>Voter List • Ward No. 18</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#111827;--muted:#667085;--line:#e5e7eb;--dark:#0f172a;--green:#15803d;--greenbg:#ecfdf3;--blue:#2563eb;--danger:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text)}
header{background:linear-gradient(135deg,#0f172a,#1e293b);color:white;padding:24px 18px;border-radius:0 0 24px 24px}
.wrap{max-width:900px;margin:auto;padding:0 16px}.eyebrow{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;opacity:.7}.title{font-size:27px;font-weight:800;margin:5px 0}.sub{font-size:13px;opacity:.75}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}.stat{background:#ffffff12;border:1px solid #ffffff1f;border-radius:13px;padding:11px}.stat b{display:block;font-size:19px}.stat span{font-size:10px;opacity:.75}
main{padding-top:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px;box-shadow:0 5px 18px #0f172a0d}
input{width:100%;padding:14px;border:1px solid #d1d5db;border-radius:12px;font-size:16px;outline:none}input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2563eb18}
.controls{display:flex;gap:7px;margin-top:9px}.filter{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:10px;font-size:12px}.filter.active{background:var(--dark);color:#fff}
.userbar{display:flex;justify-content:space-between;align-items:center;margin:10px 2px;font-size:12px;color:var(--muted)}button{cursor:pointer}.logout{border:0;background:none;color:var(--danger);font-weight:700}
.count{font-size:12px;color:var(--muted);margin:13px 2px 7px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;margin:9px 0;box-shadow:0 3px 12px #0f172a08}.card.visited{background:var(--greenbg);border-color:#bbf7d0}
.top{display:flex;justify-content:space-between;gap:10px}.name{font-size:18px;font-weight:800}.serial{font-size:11px;font-weight:800;background:#f1f5f9;padding:5px 7px;border-radius:7px;white-space:nowrap}.meta{margin-top:8px;display:grid;gap:4px;font-size:12px;color:#475467}.meta strong{color:#111827}.actions{margin-top:13px;display:flex;justify-content:space-between;align-items:center}.visit{border:0;border-radius:10px;padding:10px 13px;background:var(--dark);color:#fff;font-weight:750}.visited .visit{background:var(--green)}.badge{font-size:11px;color:var(--green);font-weight:800}.empty{text-align:center;color:var(--muted);padding:35px}
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg)}.login{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 10px 30px #0f172a12}.login h1{margin:0 0 5px}.login p{color:var(--muted);font-size:13px}.login input{margin:6px 0}.login button{width:100%;margin-top:8px;padding:13px;border:0;border-radius:11px;background:var(--dark);color:white;font-weight:800}.error{color:var(--danger);font-size:12px;min-height:18px}
@media(min-width:700px){header{margin:18px;border-radius:24px}}

.login-title-sub{font-size:18px;font-weight:700;color:#b45309;margin-top:-2px;margin-bottom:8px}
.login{position:relative;overflow:hidden}
.login:before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,#c2410c,#f59e0b,#ea580c)}
.login h1{font-size:30px;color:#1f2937}
.login button{background:linear-gradient(135deg,#c2410c,#f59e0b);box-shadow:0 7px 16px #c2410c30}
header{background:linear-gradient(135deg,#7c2d12,#c2410c 48%,#f59e0b);box-shadow:0 8px 24px #7c2d1225}
.panel{box-shadow:0 8px 22px #7c2d1210}
input:focus{border-color:#ea580c;box-shadow:0 0 0 3px #f9731618}
.filter.active{background:#c2410c;border-color:#c2410c}
.card{position:relative}
.serial{font-size:14px;font-weight:900;background:linear-gradient(135deg,#fff7ed,#ffedd5);color:#9a3412;border:2px solid #fdba74;padding:9px 11px;border-radius:11px;box-shadow:0 3px 9px #c2410c15}
.serial:before{content:"VOTER SERIAL";display:block;font-size:8px;letter-spacing:1px;color:#c2410c;margin-bottom:2px}
.card .name{font-size:20px}
.visit{background:linear-gradient(135deg,#9a3412,#ea580c)}
.visited .visit{background:linear-gradient(135deg,#15803d,#22c55e)}
@media(max-width:520px){.serial{min-width:125px;text-align:center}.card .name{font-size:19px}}
</style>
</head>
<body>
<div id="login">
  <div class="login">
    <div class="eyebrow">Private voter system</div>
    <h1>Janta Colony</h1><div class="login-title-sub">Voter List</div>
    <p>Sign in to access the voter list.</p>
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <div id="loginError" class="error"></div>
    <button id="loginBtn">Sign In</button>
  </div>
</div>

<div id="app" style="display:none">
<header><div class="wrap">
  <div class="eyebrow">Election Voter Management</div>
  <div class="title">Janta Colony — Voter List</div>
  <div class="sub">Search voters and mark visits.</div>
  <div class="stats">
    <div class="stat"><b id="total">—</b><span>Total Voters</span></div>
    <div class="stat"><b id="visited">—</b><span>Visited</span></div>
    <div class="stat"><b id="remaining">—</b><span>Remaining</span></div>
  </div>
</div></header>
<main class="wrap">
  <div class="userbar"><span id="userEmail"></span><button class="logout" id="logout">Sign out</button></div>
  <section class="panel">
    <input id="search" autocomplete="off" placeholder="Search by name or parent name…">
    <div class="controls">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="remaining">Remaining</button>
      <button class="filter" data-filter="visited">Visited</button>
    </div>
  </section>
  <div id="count" class="count"></div><div id="list"></div>
</main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://czmezvtrjirwxwlltbpl.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable__4c6OqQPgOcf07lFz2JVkA_X3ItvEp9";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let data=[], filter="all";

const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const el=id=>document.getElementById(id);

async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(session) showApp(session); else showLogin();
}
function showLogin(){el("login").style.display="grid";el("app").style.display="none";}
function showApp(session){el("login").style.display="none";el("app").style.display="block";el("userEmail").textContent=session.user.email||"";load(); resetInactivityTimer();}
async function load(){
  const {data:d,error}=await sb.from("voters").select("*").order("id");
  if(error){el("list").innerHTML='<div class="empty">Could not load voter data. Check Supabase setup.</div>';return}
  data=d||[];render();
}
function render(){
  const q=el("search").value.trim().toLowerCase();
  const arr=data.filter(v=>{
    const match=!q||String(v.name).toLowerCase().includes(q)||String(v.parent_name||"").toLowerCase().includes(q);
    return match&&(filter==="all"||(filter==="visited"&&v.visited)||(filter==="remaining"&&!v.visited));
  });
  const n=data.filter(v=>v.visited).length;
  el("total").textContent=data.length;el("visited").textContent=n;el("remaining").textContent=data.length-n;
  el("count").textContent=(q||filter!=="all")?`${arr.length} result${arr.length===1?"":"s"}`:"";
  el("list").innerHTML=arr.length?arr.map(v=>`
  <article class="card ${v.visited?"visited":""}">
    <div class="top"><div class="name">${esc(v.name)}</div><div class="serial">Voter Serial No. ${esc(v.voter_serial)}</div></div>
    <div class="meta">
      <div><strong>Father / Husband:</strong> ${esc(v.parent_name)||"—"}</div>
      <div><strong>Caste:</strong> ${esc(v.caste)||"—"}</div>
      ${v.mobile?`<div><strong>Mobile:</strong> ${esc(v.mobile)}</div>`:""}
    </div>
    <div class="actions"><span class="badge">${v.visited?"✓ VISITED":"Not visited"}</span>
    <button class="visit" onclick="toggleVisit(${v.id},${!v.visited})">${v.visited?"Undo Visit":"Mark as Visited"}</button></div>
  </article>`).join(""):'<div class="empty">No matching voter found.</div>';
}
async function toggleVisit(id,value){
  const {data:d,error}=await sb.from("voters").update({visited:value,visited_at:value?new Date().toISOString():null}).eq("id",id).select().single();
  if(error){alert("Unable to save status.");return}
  const i=data.findIndex(x=>x.id===id);if(i>=0)data[i]=d;render();
}
  // Auto logout after 1 hour of inactivity
let inactivityTimer;

function resetInactivityTimer() {
  clearTimeout(inactivityTimer);

  inactivityTimer = setTimeout(async () => {
    alert("Session expired due to 1 hour of inactivity.");
    await sb.auth.signOut();
    showLogin();
  }, 60 * 60 * 1000); // 1 hour
}

// Reset timer whenever user is active
["click", "keydown", "touchstart", "scroll", "mousemove"].forEach(event => {
  document.addEventListener(event, resetInactivityTimer, true);
});
el("search").addEventListener("input",render);
document.querySelectorAll(".filter").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");filter=b.dataset.filter;render()}));
el("loginBtn").onclick=async()=>{el("loginError").textContent="";const {error}=await sb.auth.signInWithPassword({email:el("email").value,password:el("password").value});if(error)el("loginError").textContent=error.message};
el("logout").onclick=async()=>{await sb.auth.signOut();showLogin()};
sb.auth.onAuthStateChange((event,session)=>{if(session)showApp(session);else showLogin()});
init();
</script>
</body>
</html>
